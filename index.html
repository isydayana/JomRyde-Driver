<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JomRyde Driver - Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-city-pattern min-h-screen font-sans antialiased text-gray-800 flex flex-col">

    <header class="bg-gradient-to-r from-emerald-800 to-teal-950 shadow-md sticky top-0 z-50 w-full">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="dashboard.html" class="flex items-center gap-2 text-xl font-bold text-white hover:opacity-90 transition-all cursor-pointer">
                <i class="fa-solid fa-car text-emerald-400"></i>
                <span>Jom<span class="text-emerald-400">Ryde</span><span class="text-xs font-normal text-emerald-300 ml-1 uppercase tracking-wider hidden sm:inline">Driver</span></span>
            </a>

            <nav class="flex items-center">
                <a href="register.html" class="text-xs font-bold text-emerald-900 bg-emerald-400 hover:bg-emerald-300 px-5 py-2 rounded-lg shadow-md transition-all">
                    Register
                </a>
            </nav>
        </div>
    </header>
    
    <main class="flex-grow flex items-center justify-center px-4 py-12">

        <div class="flex flex-col items-center w-full max-w-md">
            
            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col items-center justify-between w-full p-8 relative overflow-hidden">
                
                <div class="w-full text-center my-auto">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Driver Portal</h3>
                    
                    <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-gray-900 mb-2 mt-1">
                        <i class="fa-solid fa-car text-emerald-600"></i>
                        <span>Jom<span class="text-emerald-600">Ryde</span><span class="text-xs font-semibold text-emerald-500 ml-1 uppercase tracking-wider">Driver</span></span>
                    </div>

                    <h4 class="text-xl font-bold text-gray-900 mt-4">Welcome Back!</h4>
                    <p class="text-xs text-gray-400 mt-1 mb-6">Login to manage your trips & earnings</p>

                    <form id="loginForm" class="space-y-4 text-left w-full">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                                <i class="fa-regular fa-user"></i>
                            </span>
                            <input type="text" id="username" placeholder="Username : admin123" required
                                class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
                        </div>

                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="password" placeholder="Password : admin123" required
                                class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
                        </div>

                        <div class="text-right">
                            <a href="#" class="text-xs font-semibold text-emerald-600 hover:underline">Forgot password?</a>
                        </div>

                        <button type="submit" 
                            class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-medium rounded-lg text-sm shadow-md transition-all mt-2 cursor-pointer">
                            Login
                        </button>

                        <p id="errorMessage" class="text-center text-xs text-red-600 font-medium hidden pt-2">
                            <i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid username or password.
                        </p>
                    </form>

                    <div class="text-center mt-5 pt-2 border-t border-gray-50">
                        <p class="text-xs text-gray-600">
                            Don't have an account? <a href="register.html" class="text-emerald-600 font-semibold hover:underline">Register here</a>
                        </p>
                    </div>
                </div>
                
            </div> 
            
            <div class="w-full mt-11"> 
                <br> 
                <img src="picture login page.png" alt="Login Illustration" 
                    class="w-full h-55 object-cover rounded-2xl">
                <br> <br>
            </div>
            
        </div> 
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const userInp = document.getElementById('username').value;
            const passInp = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // login setting admin123 
            if(userInp === "admin123" && passInp === "admin123") {
                errorMsg.classList.add('hidden');
                alert("Login Successful! Welcome Back!");
                window.location.href = "dashboard.html";
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('password').value = "";
            }
        });
    </script>
</body>
</html>
