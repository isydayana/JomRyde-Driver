<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JomRyde Driver - Register</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-city-pattern min-h-screen font-sans antialiased text-gray-800 flex flex-col">

    <header class="bg-gradient-to-r from-emerald-800 to-teal-950 shadow-md sticky top-0 z-50 w-full">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="dashboard.html" class="flex items-center gap-2 text-xl font-bold text-white hover:opacity-90 transition-all cursor-pointer">
                <i class="fa-solid fa-car text-emerald-400"></i>
                <span>Jom<span class="text-emerald-400">Ryde</span><span class="text-xs font-normal text-emerald-300 ml-1 uppercase tracking-wider hidden sm:inline">Driver</span></span>
            </a>

            <nav class="flex items-center">
                <a href="index.html" class="text-xs font-bold text-emerald-900 bg-emerald-400 hover:bg-emerald-300 px-5 py-2 rounded-lg shadow-md transition-all">
                    Login
                </a>
            </nav>
        </div>
    </header>
    
    <main class="flex-grow flex items-center justify-center px-4 py-12">

        <div class="flex flex-col items-center w-full max-w-md">
            
            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col items-center justify-between w-full p-8 relative overflow-hidden">
                
                <div class="w-full text-center my-auto">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Driver Application</h3>
                    
                    <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-gray-900 mb-2 mt-1">
                        <i class="fa-solid fa-car text-emerald-600"></i>
                        <span>Jom<span class="text-emerald-600">Ryde</span><span class="text-xs font-semibold text-emerald-500 ml-1 uppercase tracking-wider">Driver</span></span>
                    </div>

                    <h4 class="text-xl font-bold text-gray-900 mt-4">Join Us Today!</h4>
                    <p class="text-xs text-gray-400 mt-1 mb-6">Register to start tracking your trips & earnings</p>

                    <form id="registerForm" class="space-y-4 text-left w-full">
                        
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                                <i class="fa-regular fa-id-card"></i>
                            </span>
                            <input type="text" id="regName" placeholder="Full Name" required
                                class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
                        </div>

                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" id="regEmail" placeholder="Email Address" required
                                class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
                        </div>

                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                                <i class="fa-regular fa-user"></i>
                            </span>
                            <input type="text" id="regUsername" placeholder="Create Username" required
                                class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
                        </div>

                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="regPassword" placeholder="Create Password" required
                                class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
                        </div>

                        <button type="submit" 
                            class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-medium rounded-lg text-sm shadow-md transition-all mt-4 cursor-pointer">
                            Register
                        </button>
                    </form>

                    <div class="text-center mt-5 pt-2 border-t border-gray-50">
                        <p class="text-xs text-gray-600">
                            Already have an account? <a href="index.html" class="text-emerald-600 font-semibold hover:underline">Login here</a>
                        </p>
                    </div>
                </div>
                
            </div> 
            
            <div class="w-full mt-11"> 
                <br> 
                <img src="picture login page.png" alt="Login Illustration" 
                    class="w-full h-55 object-cover rounded-2xl">
                <br> <br>
            </div>
            
        </div> 
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const fullName = document.getElementById('regName').value;
            
            // Success pop-up for registration simulation without a database
            alert("Registration Successful! Account created for " + fullName + ". You can now log in using the admin account.");
            
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
